apiVersion: apps/v1
kind: Deployment
metadata:
  name: hotel-cms-app
  namespace: hotel-cms
  labels:
    app: hotel-cms-app
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: hotel-cms-app
  template:
    metadata:
      labels:
        app: hotel-cms-app
    spec:
      securityContext:
        fsGroup: 33
      containers:
        - name: app
          image: hotel-cms:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          envFrom:
            - configMapRef:
                name: hotel-cms-config
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: hotel-cms-secret
                  key: DB_USER
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: hotel-cms-secret
                  key: DB_PASS
          volumeMounts:
            - name: uploads-volume
              mountPath: /var/www/html/uploads
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /health.php
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health.php
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: uploads-volume
          persistentVolumeClaim:
            claimName: uploads-pvc
